name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Buat folder platform (tidak ikut repo)
        run: flutter create --platforms=android,windows --project-name asset_app --org id.perusahaan .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          flutter test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan proyek
        shell: bash
        run: |
          flutter create --platforms=android,windows --project-name asset_app --org id.perusahaan .
          rm -f test/widget_test.dart
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release
      - name: Portable zip (DLL VC++ app-local)
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          foreach ($d in "msvcp140.dll","vcruntime140.dll","vcruntime140_1.dll") { Copy-Item "C:\Windows\System32\$d" $rel }
          Compress-Archive -Path "$rel\*" -DestinationPath AssetApp-win-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AssetApp-win-x64
          path: AssetApp-win-x64.zip

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan proyek
        run: |
          flutter create --platforms=android,windows --project-name asset_app --org id.perusahaan .
          rm -f test/widget_test.dart
          # minSdk 24 dan izin kamera (scan QR, foto)
          sed -i 's/minSdk = .*/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Bug alat lint Gradle (crash di image_picker_android) menggagalkan build release
          printf '\nandroid {\n    lint {\n        checkReleaseBuilds = false\n    }\n}\n' >> android/app/build.gradle.kts
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: AssetApp-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
