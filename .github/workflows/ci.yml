name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Buat folder platform (tidak ikut repo)
        run: flutter create --platforms=android,windows --project-name asset_app --org id.perusahaan .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          flutter test
