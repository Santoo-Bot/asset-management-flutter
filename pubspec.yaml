name: asset_app
description: Aplikasi manajemen aset offline-first (Android + Windows portable).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

# Nomor versi dikunci di pubspec.lock setelah `flutter pub get` pertama.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  drift: ^2.18.0
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.3
  win32: ^5.5.0
  ffi: ^2.1.2
  uuid: ^4.4.0
  crypto: ^3.0.3
  # Impor/ekspor
  csv: ^6.0.0
  excel: ^4.0.6
  # Label dan laporan
  pdf: ^3.10.8
  printing: ^5.12.0
  # Foto, file, scan
  image: ^4.2.0
  file_picker: ^8.0.5
  image_picker: ^1.1.2      # kamera, hanya Android
  mobile_scanner: ^5.1.1    # hanya Android
  # Backup dan paket perubahan (zip)
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
